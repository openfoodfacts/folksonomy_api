 name: Run release-please
 on:
   push:
     branches:
       - main

 jobs:
   release-please:
     if: github.event.repository.fork == false
     runs-on: ubuntu-latest
     steps:
       - uses: googleapis/release-please-action@v5.0.0
         with:
           token: ${{ secrets.GITHUB_TOKEN }}
           release-type: simple
