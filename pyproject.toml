[project]
name = "folksonomy_api"
version = "1.1.0"
description = "A Folksonomy Engine for Open Food Facts"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Open Food Facts", email = "contact@openfoodfacts.org" }]
dependencies = [
  "aiohttp (>=3.14.3,<4.0.0)",
  "aiopg (>=1.4.0,<2.0.0)",
  "fastapi (>=0.115.11,<0.116.0)",
  "gunicorn (>=25.3.0,<26.0.0)",
  "psycopg2-binary (>=2.9.13,<3.0.0)",
  "python-multipart (>=0.0.31,<0.0.32)",
  "requests (>=2.34.2,<3.0.0)",
  "uvicorn (>=0.34.0,<0.35.0)",
  "yoyo-migrations (>=9.0.0,<10.0.0)",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "httpx>=0.28.1,<0.29.0",
  "pre-commit>=4.6.2,<5.0.0",
  "pytest>=8.3.5,<9.0.0",
  "pytest-asyncio>=0.25.3,<0.26.0",
  "pytest-cov>=6.0.0,<8.0.0",
]

[tool.pytest]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
